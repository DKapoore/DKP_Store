async function call(fn,...a){if(!navigator.onLine)throw new Error('You are offline. Please reconnect to continue.');

 try{return JSON.parse(t)}catch(e){throw new Error('The server did not send a valid reply. Check that config.js has your Web App URL (ending in /exec) and that the Apps Script is deployed with access set to Anyone.')}}

let OL=[];async function orders(){if(!SV)SV=(await api('settings')).data;OL=(await api('orders')).data;drawO()}
const FL=[['','All'],['RECEIPT_SUBMITTED','Needs review'],['PAYMENT_PENDING','Awaiting payment'],['PAID','Paid'],['REJECTED','Rejected'],['AWAITING_APPROVAL','Awaiting approval'],['REFUND_REQUESTED','Refund requested'],['REFUNDED','Refunded']];
function drawO(){if(!document.getElementById('ol'))v.innerHTML='<h1 class=pg>Orders</h1><div class=tb><input id=q type=search placeholder="Search order, name, mobile, email, product" aria-label="Search orders" oninput="drawO()"><div class=chipsr id=fc role=group aria-label="Filter by payment status"></div></div><div id=ol></div>';

function orderCard(o){const id=o['Order ID'],ps=o['Payment Status'];
 return `<article class="c oc"><div class=oh><div><b class=oid>${E(id)}</b><div class=ms>${E(o['Product Title'])} \u00D7${o.Quantity}${Number(o['Delivery Charge'])>0?` \u00B7 delivery \u20B9${o['Delivery Charge']}`:''}</div></div><div class=oa><b>\u20B9${o['Total Amount']}</b><span class="pill ${pc(ps)}">${E(ps)}</span><span class=pill>${E(o['Order Status'])}</span>${o['Access Status']==='APPROVED'?'<span class="pill ok">ACCESS APPROVED</span>':''}${o['Availability Status']?`<span class=pill>${o['Availability Status']==='CHECK_REQUIRED'?'Availability Check Required':E(o['Availability Status'])}</span>`:''}</div></div>
<div class=ob><b>${E(o['Customer Name'])}</b><div class=ms>${E(o.Mobile)} \u00B7 ${E(o.Email)}</div>${o.Area?`<div class=ms>${E([o.House,o.Building,o.Street,o.Area,o.City,o.State,o.Pincode,o.Country].filter(Boolean).join(', '))}</div>`:''}${o['Customer Lat']!==''?`<div class=ms><a target=_blank rel=noopener href="https://www.google.com/maps?q=${o['Customer Lat']},${o['Customer Lng']}">Open map</a>${o['Distance KM']!==''?' \u00B7 '+o['Distance KM']+' KM':''} \u00B7 \u00B1${Math.round(o['GPS Accuracy'])}m</div>`:''}${o.UTR?`<div class=ms>UTR <b>${String(o.UTR).replace(/[<>&"]/g,'')}</b></div>`:''}</div>
<div class="r ac">${/^https:\/\//.test(o['Receipt URL'])?`<a class=bt href="${E(o['Receipt URL'])}" target=_blank rel=noopener>OPEN RECEIPT</a>`:''}${ps==='RECEIPT_SUBMITTED'?`<button class=p onclick="pay('${id}','VERIFY')">VERIFY</button><button class=d onclick="pay('${id}','REJECT')">REJECT</button>`:''}${ps==='PAID'&&o['Product Type']!=='PHYSICAL'?`<button class=p onclick="apv('${id}')">${o['Access Status']==='APPROVED'?'RESEND ACCESS':'APPROVE ACCESS'}</button>`:''}<button onclick="det('${id}')">DETAILS</button><button onclick="wa('${id}')">WHATSAPP</button></div>
${ps==='AWAITING_APPROVAL'?`<div class="r ac"><input id="ch${id}" type=number min=0 placeholder="Delivery charge \u20B9 (blank = keep \u20B9${o['Delivery Charge']})" aria-label="Delivery charge"><button class=p onclick="ap('${id}','APPROVE')">APPROVE</button><button class=d onclick="ap('${id}','DECLINE')">DECLINE</button></div>`:''}${ps==='REFUND_REQUESTED'?`<div class="r ac"><button class=p onclick="rf('${id}')">MARK REFUNDED</button></div>`:''}${o['Availability Status']==='CHECK_REQUIRED'&&ps==='PAID'?`<div class="r ac"><button class=p onclick="av('${id}','AVAILABLE')">CONFIRM AVAILABILITY \u2192 PROCESS</button><button class=d onclick="av('${id}','UNAVAILABLE')">MARK UNAVAILABLE \u2192 REFUND REQUIRED</button></div>`:''}${ps==='PAID'&&o['Availability Status']!=='CHECK_REQUIRED'&&o['Product Type']!=='DIGITAL'?`<div class="r ac"><select id="s${id}" aria-label="Order status">${['PROCESSING','PACKED','SHIPPED','OUT_FOR_DELIVERY','DELIVERED'].map(x=>`<option>${x}</option>`).join('')}</select><input id="c${id}" placeholder="Courier"><input id="n${id}" placeholder="Tracking no."><input id="u${id}" placeholder="Tracking URL"><button onclick="ship('${id}')">UPDATE</button></div>`:''}</article>`}
async function apv(id){if(!confirm('Approve access and email the customer?'))return;const r=await api('approveAccess',{orderId:id});toast(r.message);if(r.success&&r.data.wa&&confirm('Open the WhatsApp message to send the access link?'))window.open(r.data.wa,'_blank','noopener');orders()}

function delP(i){const r=PR.rows[i],id=r['Product ID'];let force=false,dlg=document.getElementById('dd');if(!dlg){dlg=document.createElement('dialog');dlg.id='dd';dlg.className='dd';document.body.appendChild(dlg)}
